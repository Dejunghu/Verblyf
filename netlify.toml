# Verblyf op Netlify
# De Next.js-runtime draait server components, API-routes en middleware als
# Netlify Functions. Je hoeft niets te exporteren of te statificeren.

[build]
  # De placeholder-URL geldt alleen tijdens het bouwen: Prisma wil bij het
  # genereren een waarde zien. Tijdens het draaien blijft DATABASE_URL leeg,
  # zodat de site netjes in demo-modus staat tot de echte database er is.
  command = "DATABASE_URL=\"postgresql://placeholder:placeholder@localhost:5432/placeholder\" npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Preview-deploys van pull requests: handig als ik een verbetering voorstel —
# je ziet hem live voordat hij naar productie gaat.
[context.deploy-preview]
  # De placeholder-URL geldt alleen tijdens het bouwen: Prisma wil bij het
  # genereren een waarde zien. Tijdens het draaien blijft DATABASE_URL leeg,
  # zodat de site netjes in demo-modus staat tot de echte database er is.
  command = "DATABASE_URL=\"postgresql://placeholder:placeholder@localhost:5432/placeholder\" npx prisma generate && npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
